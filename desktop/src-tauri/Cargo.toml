[package]
name = "agent-board-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPanel", "NSWindow", "NSResponder", "NSEvent", "NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSDictionary", "NSValue", "NSString"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow"] }
